name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de teste
        run: pip install -r docker/airflow/requirements.txt
      - name: Lint
        run: ruff check src tests dags/cnpj_empresas.py
      - name: Testes
        run: python -m pytest
